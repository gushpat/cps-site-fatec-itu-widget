
<!-- =========================================================
     PARCEIROS — INÍCIO
     =========================================================
     
     Exibe os logos de empresas parceiras da instituição.

     Cada logo funciona como um link para o site da respectiva
     empresa.

     O componente não utiliza JavaScript.
     ========================================================= -->


<style>

    /* =========================================================
       CONTAINER DOS PARCEIROS
       ========================================================= */

    .cps-parceiros,
    .cps-parceiros * {
        box-sizing: border-box;
    }

    .cps-parceiros {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }


    /* =========================================================
       CARD
       ========================================================= */

    .cps-parceiros__card {
        display: flex;

        width: 200px;
        min-height: 120px;
        padding: 10px;

        align-items: center;
        justify-content: center;

        border: 1px solid #ccc;
        border-radius: 5px;

        text-align: center;

        transition: box-shadow 0.3s ease;
    }


    /*
     * O link ocupa todo o espaço disponível do card.
     * Dessa forma, o usuário pode clicar em qualquer ponto
     * do card, e não somente sobre a imagem.
     */

    .cps-parceiros__card a {
        display: flex;

        width: 100%;
        height: 100%;

        align-items: center;
        justify-content: center;
    }


    /* =========================================================
       LOGOS
       ========================================================= */

    .cps-parceiros__card img {
        display: block;

        width: 100%;
        height: auto;
        max-height: 100px;

        object-fit: contain;
    }


    /* =========================================================
       INTERAÇÃO
       ========================================================= */

    .cps-parceiros__card:hover,
    .cps-parceiros__card:has(a:focus-visible) {
        box-shadow: 0 0 5px #999;
    }


    /*
     * Mantém o componente acessível para usuários que navegam
     * utilizando teclado.
     */

    .cps-parceiros__card a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
    }


    /* =========================================================
       ACESSIBILIDADE — REDUÇÃO DE MOVIMENTO
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

        .cps-parceiros__card {
            transition: none;
        }

    }

</style>


<!-- =========================================================
     LISTA DE PARCEIROS
     ========================================================= -->

<section
    class="cps-parceiros"
    aria-label="Empresas parceiras"
>


    <!-- =====================================================

        >
